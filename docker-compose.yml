version: '3.8'

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evaluacion-net

    entrypoint: >
      sh -c "
      echo 'CREATE DATABASE productos; CREATE DATABASE pedidos;' > /docker-entrypoint-initdb.d/init.sql;
      exec docker-entrypoint.sh postgres
      "


  ms-producto:
    build: ./ms-producto
    container_name: ms-producto
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/productos
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres-db
    networks:
      - evaluacion-net


  ms-pedido:
    build: ./ms-pedido
    container_name: ms-pedido
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pedidos
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres-db
      - ms-producto
    networks:
      - evaluacion-net

volumes:
  postgres_data:

networks:
  evaluacion-net:
    driver: bridge